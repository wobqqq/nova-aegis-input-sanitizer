# Composer is left out: the core resolves from the ../nova-aegis checkout, which
# Dependabot cannot see. The weekly audit workflow and CI against the latest core
# cover the PHP dependencies instead.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ['*']
